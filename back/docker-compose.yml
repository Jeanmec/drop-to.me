version: '3.8'

services:
  nest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - '3000:3000'
      - '9000:9000'
    labels:
      # Désactiver le router par défaut de Coolify en utilisant des noms de routers personnalisés

      # Router Socket.IO (priorité très élevée pour être traité avant le router Coolify)
      - 'traefik.http.routers.custom-socketio.rule=Host(`back.drop-to.me`) && PathPrefix(`/socket.io`)'
      - 'traefik.http.routers.custom-socketio.entrypoints=https'
      - 'traefik.http.routers.custom-socketio.tls=true'
      - 'traefik.http.routers.custom-socketio.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.custom-socketio.service=custom-socketio-svc'
      - 'traefik.http.routers.custom-socketio.priority=200'
      - 'traefik.http.services.custom-socketio-svc.loadbalancer.server.port=3000'

      # Router PeerJS (priorité très basse - catch-all pour tout le reste)
      - 'traefik.http.routers.custom-peerjs.rule=Host(`back.drop-to.me`) && PathPrefix(`/`)'
      - 'traefik.http.routers.custom-peerjs.entrypoints=https'
      - 'traefik.http.routers.custom-peerjs.tls=true'
      - 'traefik.http.routers.custom-peerjs.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.custom-peerjs.service=custom-peerjs-svc'
      - 'traefik.http.routers.custom-peerjs.priority=1'
      - 'traefik.http.services.custom-peerjs-svc.loadbalancer.server.port=9000'
